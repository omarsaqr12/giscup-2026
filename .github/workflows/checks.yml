name: Geometry and format checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build portable solver and figure tests
        run: |
          make portable
          make test_figures
      - name: Compare geometry against the published figure fixtures
        run: ./test_figures tests/figures_groundtruth.txt
      - name: Verify submission-format failure paths
        run: bash tests/test_format_gate.sh
      - name: Run the tiny quickstart and validate its output format
        run: |
          OMP_NUM_THREADS=2 timeout 120s ./giscup solve \
            --data data/tiny/tiny40.geojson --tau 0.5 --k 3 \
            --lns-sec 0 --no-auto --power 1 --out "$RUNNER_TEMP/trial.txt"
          make check-format SUBMISSION="$RUNNER_TEMP/trial.txt" BLOCKS=1
